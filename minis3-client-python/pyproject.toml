[project]
name = "minis3"
version = "0.1.0"
description = "Python client for the miniS3 storage service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minis3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

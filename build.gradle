plugins {
    id 'org.springframework.boot' version '4.0.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    group = 'com.anirudh.storage'
    // CI passes -PreleaseVersion=1.2.3 when publishing a release
    version = findProperty('releaseVersion') ?: '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << '-parameters'
        }
        tasks.named('test') {
            useJUnitPlatform()
        }
    }

    // client + starter publish to GitHub Packages (./gradlew publish) as well as mavenLocal
    plugins.withId('maven-publish') {
        publishing {
            repositories {
                maven {
                    name = 'GitHubPackages'
                    url = uri('https://maven.pkg.github.com/Parker023/miniS3')
                    credentials {
                        username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
                        password = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.key')
                    }
                }
            }
        }
    }
}

spring:
  application:
    name: minis3-storage-service
  autoconfigure:
    # users come from our own table (JWT / API keys); skip Boot's in-memory user and its logged password
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/minis3}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    # all database work happens inside services; don't hold a connection open while writing responses
    open-in-view: false
#    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
server:
  port: 2399
  servlet:
    context-path: /storage/minis3

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

minis3:
  upload:
    max-size: 20MB
  app:
    storage:
      # absolute path in production, e.g. /var/lib/minis3/storage
      location: ${MINIS3_STORAGE_LOCATION:./storage}
  presign:
    # public base URL put in pre-signed links, e.g. https://laptop.tailnet.ts.net/storage/minis3
    # empty: built from the incoming request
    base-url: ${MINIS3_PUBLIC_URL:}

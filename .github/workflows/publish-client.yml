# Publishes minis3-client and minis3-spring-boot-starter to GitHub Packages.
# Trigger: push a tag like v0.1.0, or run manually with a version.
name: Publish client

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.0'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test everything
        run: ./gradlew build

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: ./gradlew :minis3-client:publish :minis3-spring-boot-starter:publish -PreleaseVersion="${VERSION#v}"
